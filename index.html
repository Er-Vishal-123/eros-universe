<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eros Universe · Home and Create (v8)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#00a8e8; --sky:#4fc3f7; --green:#86e000; --amber:#f5a524;
  --grad:linear-gradient(90deg,#86e000 0%,#4fc3f7 55%,#00a8e8 100%);
  --gradsoft:linear-gradient(135deg,rgba(134,224,0,.16),rgba(0,168,232,.16));
  --rail:250px;
  --disp:'Poppins','Noto Sans Devanagari',system-ui,sans-serif;
  --body:'Inter','Noto Sans Devanagari',system-ui,sans-serif;

  --bg:#07080a; --topbg:rgba(7,8,10,.86); --railbg:#08090c;
  --surface:#0d1218; --surface2:#121a22;
  --border:#1d2731; --border2:#232c37;
  --txt:#e9eef4; --mut:#818d9c; --mut2:#5f6a78;
  --pill:#141c24; --pillbd:#222d38; --pilltxt:#b3bfcb;
  --input:#0f141a; --inputbd:#202932;
  --hover:#101821;
  --shadow:none;
  --heroBase:linear-gradient(180deg,#0b1119 0%,#07080a 100%);
  --heroA:rgba(0,168,232,.26); --heroB:rgba(134,224,0,.09);
  --beam:rgba(140,190,225,.10);
}
body.light{
  --bg:#ffffff; --topbg:rgba(255,255,255,.9); --railbg:#fbfcfd;
  --surface:#ffffff; --surface2:#f6f9fb;
  --border:#e4eaf0; --border2:#dfe6ed;
  --txt:#0c141b; --mut:#5c6976; --mut2:#8a95a1;
  --pill:#f2f6f9; --pillbd:#dfe6ed; --pilltxt:#35424f;
  --input:#f5f8fa; --inputbd:#e2e9ef;
  --hover:#f0f5f9;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.04);
  --heroBase:linear-gradient(180deg,#f2fbff 0%,#ffffff 100%);
  --heroA:rgba(0,168,232,.16); --heroB:rgba(134,224,0,.16);
  --beam:rgba(0,168,232,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top ---------- */
.top{position:sticky;top:0;z-index:60;height:66px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--topbg);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.dots{display:grid;grid-template-columns:repeat(3,4px);gap:3px;padding:6px;border-radius:8px}
.dots i{width:4px;height:4px;background:var(--mut);border-radius:1px;display:block}
.logo{font-family:var(--disp);font-weight:700;line-height:.95;cursor:pointer}
.logo .e{font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .u{font-size:9.5px;letter-spacing:.34em;color:var(--blue);display:block;font-weight:600}
.search{flex:1;max-width:520px;margin:0 auto;height:42px;border-radius:11px;background:var(--input);border:1px solid var(--inputbd);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mut2);font-size:13.5px;overflow:hidden;white-space:nowrap}
.search svg{width:17px;height:17px;stroke:var(--mut);flex:none}
.topright{display:flex;align-items:center;gap:10px;margin-left:auto}
.subscribe{height:38px;padding:0 20px;border-radius:10px;background:var(--grad);color:#05201c;font-family:var(--disp);font-weight:600;font-size:14px}
.seg{display:flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden;height:34px}
.seg button{padding:0 11px;font-size:12px;font-weight:600;color:var(--mut);font-family:var(--disp)}
.seg button.on{background:var(--gradsoft);color:var(--blue)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--mut)}
.iconbtn:hover{background:var(--hover);color:var(--txt)}
.iconbtn svg{width:19px;height:19px}
.credits{height:34px;padding:0 12px 0 8px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.credits .coin{width:17px;height:17px;border-radius:50%;background:linear-gradient(160deg,#ffd166,#f5a524);display:grid;place-items:center;color:#5a3b00;font-size:10px}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background-size:cover;background-position:center 20%;cursor:pointer}

/* ---------- shell ---------- */
.shell{display:flex;min-height:calc(100vh - 66px)}
.rail{width:var(--rail);flex:none;border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:66px;height:calc(100vh - 66px);display:flex;flex-direction:column;gap:2px;overflow:auto;background:var(--railbg)}
.nav{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:11px;color:var(--pilltxt);font-family:var(--disp);font-weight:500;font-size:15px;width:100%;text-align:left}
.nav svg{width:21px;height:21px;flex:none;stroke:var(--mut)}
.nav:hover{background:var(--hover);color:var(--txt)}
.nav.on{color:var(--blue);background:var(--gradsoft)}
.nav.on svg{stroke:var(--blue)}
.sub{padding:2px 0 6px 46px;display:flex;flex-direction:column;gap:1px}
.sub button{text-align:left;padding:7px 0;color:var(--mut);font-size:13.5px}
.sub button.on{color:var(--blue);font-weight:600}
.railbottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.railnote{font-size:11.5px;color:var(--mut2);line-height:1.55;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;margin-top:10px}
.railnote b{color:var(--mut)}

.main{flex:1;min-width:0}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:56px 40px 42px;border-bottom:1px solid var(--border)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 72% -12%,var(--heroA),transparent 62%),radial-gradient(700px 340px at 16% 6%,var(--heroB),transparent 60%),var(--heroBase)}
.hero::after{content:"";position:absolute;top:-30%;left:54%;width:36%;height:170%;background:linear-gradient(105deg,transparent,var(--beam),transparent);transform:rotate(11deg);filter:blur(24px)}
.hero>*{position:relative;z-index:2}
.hero h1{font-size:45px;font-weight:700;line-height:1.08;max-width:24ch}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ask{margin-top:30px;max-width:820px;border-radius:16px;padding:1px;background:linear-gradient(120deg,rgba(134,224,0,.55),rgba(0,168,232,.7))}
.ask-in{background:var(--bg);border-radius:15px;padding:17px 18px 13px}
.ask-in .ph{color:var(--mut2);font-size:16px}
.ask-row{display:flex;align-items:center;margin-top:20px}
.ask-row .brand{color:var(--blue);font-family:var(--disp);font-weight:600;font-size:14px}
.ask-row .tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.circ{width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);display:grid;place-items:center;color:var(--mut)}
.circ svg{width:17px;height:17px}
.circ.go{background:var(--gradsoft);border-color:rgba(0,168,232,.45);color:var(--blue)}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.chip{padding:8px 15px;border-radius:20px;border:1px solid var(--pillbd);background:var(--pill);font-size:13px;color:var(--pilltxt)}
.chip:hover{border-color:var(--blue);color:var(--txt)}

/* ---------- sections ---------- */
.sec{padding:34px 40px 0}
.sec:last-of-type{padding-bottom:20px}
.sechead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.sechead h2{font-size:21px;font-weight:600}
.sechead .more{margin-left:auto;color:var(--blue);font-size:13px;font-weight:500;white-space:nowrap}

/* outcome tiles */
.outcomes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.oc{border-radius:14px;border:1px solid var(--border);height:118px;position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:13px;transition:.16s}
.oc::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(6,10,14,.45),rgba(6,10,14,.88))}
.oc>*{position:relative;z-index:2}
.oc:hover{transform:translateY(-2px);border-color:var(--blue)}
.oc .ic{width:32px;height:32px;border-radius:9px;background:rgba(8,14,20,.55);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center}
.oc .ic svg{width:18px;height:18px;stroke:#dff1ff}
.oc .t{font-family:var(--disp);font-weight:600;font-size:13.5px;line-height:1.25;color:#fff}
.oc .s{font-size:11px;color:#9fb2c2}

/* big cards */
.bigcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.bc{border-radius:16px;border:1px solid var(--border);overflow:hidden;text-align:left;background:var(--surface);display:flex;flex-direction:column;align-items:stretch;transition:.16s;box-shadow:var(--shadow)}
.bc:hover{transform:translateY(-3px);border-color:var(--blue)}
.bc .still{height:124px;position:relative}
.bc .still .ic{position:absolute;left:14px;bottom:14px;width:38px;height:38px;border-radius:11px;background:rgba(8,14,20,.6);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center}
.bc .still .ic svg{width:20px;height:20px;stroke:#dff1ff}
.bc .body{padding:14px;display:flex;flex-direction:column;gap:5px;flex:1}
.bc .t{font-family:var(--disp);font-size:16px;font-weight:600}
.bc .s{font-size:12.5px;color:var(--mut);line-height:1.45}
.bc .meta{margin-top:auto;padding-top:10px;font-size:11px;color:var(--mut2)}

.packs{display:grid;grid-template-columns:repeat(8,1fr);gap:11px}
.pk{border-radius:12px;border:1px solid var(--border);height:100px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:11px}
.pk::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(6,10,14,.9))}
.pk b{position:relative;z-index:2;font-family:var(--disp);font-size:13px;font-weight:600;color:#fff}
.pk:hover{border-color:var(--blue)}

.strip{display:flex;gap:12px;overflow:auto;padding-bottom:8px}
.mini{flex:none;width:168px;text-align:left}
.mini .still{height:108px;border-radius:11px;border:1px solid var(--border);position:relative;overflow:hidden}
.mini b{display:block;font-size:12.5px;font-weight:500;margin-top:8px;font-family:var(--disp)}
.mini span{font-size:11px;color:var(--mut2)}

.banner{margin:34px 40px 0;border-radius:18px;border:1px solid var(--border);padding:28px 30px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;background:radial-gradient(700px 300px at 8% 20%,var(--heroB),transparent 60%),radial-gradient(700px 300px at 92% 90%,var(--heroA),transparent 60%),var(--surface)}
.banner h3{font-size:25px;font-weight:700}
.banner p{color:var(--mut);font-size:14px;margin:8px 0 0;max-width:50ch}
.banner .cta{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.priceblk{display:flex;flex-direction:column;justify-content:center;padding-right:14px;border-right:1px solid var(--border2)}
.priceblk .amt{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.priceblk .sub{font-size:11px;color:var(--mut2);margin-top:4px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.badges span{font-size:11.5px;color:var(--pilltxt);border:1px solid var(--pillbd);background:var(--pill);border-radius:20px;padding:5px 11px}

.kicker{font-family:var(--disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut2);font-weight:600;margin-bottom:8px}
.btn{height:44px;padding:0 22px;border-radius:11px;background:var(--grad);color:#05201c;font-family:var(--disp);font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.btn.ghost{background:none;border:1px solid var(--border2);color:var(--txt)}

/* ---------- Ban Jao Star ---------- */
.bjs{padding:34px 40px 0}
.bjs .sechead{margin-bottom:4px}
.bjs-sub{font-size:14px;color:var(--mut);margin-bottom:18px}
.bjs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.bjs-banner{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border2);min-height:300px;display:flex;align-items:flex-end;background-size:cover;background-position:center;transition:border-color .2s,transform .2s}
.bjs-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,14,.35) 20%,rgba(6,10,14,.93))}
.bjs-banner:hover{border-color:var(--blue);transform:translateY(-3px)}
.bjs-in{position:relative;z-index:2;padding:22px;width:100%}
.bjs-in h3{font-size:25px;font-weight:700;color:#fff;margin-top:11px}
.bjs-in p{font-size:12.8px;color:#b9c8d6;margin:7px 0 0;line-height:1.5;max-width:46ch}
@media(max-width:820px){.bjs{padding:26px 18px 0}.bjs-grid{grid-template-columns:1fr}.bjs-banner{min-height:280px}}

/* centred home hero */
.hero.center{text-align:center;padding-top:84px;padding-bottom:64px}
.hero.center h1{margin:0 auto}
.hero.center .ask{margin:34px auto 0;text-align:left}
.hero.center .chips{justify-content:center}
@media(max-width:820px){.hero.center{padding-top:48px;padding-bottom:40px}}

/* notes */
.note{display:none;border-left:2px solid var(--green);background:var(--surface2);padding:10px 14px;border-radius:0 10px 10px 0;font-size:12.5px;color:var(--mut);margin:26px 40px 0;max-width:980px}
body.notes .note{display:block}
.note b{color:var(--txt)}
.notebtn{position:fixed;right:20px;bottom:20px;z-index:80;height:40px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--border2);color:var(--mut);font-family:var(--disp);font-weight:600;font-size:12.5px;box-shadow:0 8px 26px rgba(0,0,0,.22)}
body.notes .notebtn{background:var(--gradsoft);color:var(--blue);border-color:var(--blue)}

/* ---------- course popup ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.mask{position:absolute;inset:0;background:rgba(4,7,10,.62);backdrop-filter:blur(6px);animation:fade .18s ease}
.sheet{position:relative;z-index:2;width:min(560px,calc(100% - 32px));margin:6vh auto 0;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.2,.8,.3,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.sheet .banner-top{height:118px;position:relative;display:flex;align-items:flex-end;padding:16px}
.sheet .banner-top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,14,.25),rgba(6,10,14,.85))}
.sheet .newtag{position:absolute;top:14px;left:16px;z-index:3;background:var(--grad);color:#05201c;font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.14em;padding:4px 10px;border-radius:6px}
.xbtn{position:absolute;top:12px;right:12px;z-index:4;width:32px;height:32px;border-radius:50%;background:rgba(6,10,14,.6);border:1px solid rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1}
.sheet .body{padding:20px 22px 22px}
.sheet h3{font-size:24px;font-weight:700;line-height:1.15}
.sheet .lede{color:var(--mut);font-size:13.5px;margin:9px 0 0}
.priceline{display:flex;align-items:center;gap:12px;margin:18px 0 4px;flex-wrap:wrap}
.priceline .amt{font-family:var(--disp);font-size:32px;font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.priceline .sub{font-size:11.5px;color:var(--mut2)}
.freetag{margin-left:auto;font-size:11.5px;font-weight:600;color:#5c9b1f;border:1px solid rgba(134,224,0,.4);border-radius:20px;padding:5px 11px}
body:not(.light) .freetag{color:#b7e77a}
.lrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--border)}
.lrow .th{width:52px;height:34px;border-radius:7px;flex:none;position:relative;overflow:hidden}
.lrow .th span{position:absolute;inset:0;background:rgba(6,10,14,.3)}
.lrow b{font-size:12.5px;font-weight:500;flex:1;font-family:var(--disp)}
.lrow .d{font-size:11.5px;color:var(--mut2)}
.lrow .f{font-size:10px;font-weight:700;color:#05201c;background:var(--green);border-radius:4px;padding:2px 6px}
.sheetcta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheetcta .btn{flex:1;justify-content:center;min-width:150px}
.later{display:block;width:100%;text-align:center;margin-top:12px;font-size:12.5px;color:var(--mut2)}
.popbtn{position:fixed;right:20px;bottom:66px;z-index:80;height:40px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--border2);color:var(--mut);font-family:var(--disp);font-weight:600;font-size:12.5px;box-shadow:0 8px 26px rgba(0,0,0,.22)}
@media (max-width:820px){
  .sheet{width:100%;margin:0;position:absolute;left:0;right:0;bottom:0;max-height:92vh;border-radius:20px 20px 0 0;animation:up .24s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .popbtn{bottom:122px}
}

.agentseg{display:inline-flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden;height:32px}
.agentseg button{padding:0 13px;font-family:var(--disp);font-size:12.5px;font-weight:600;color:var(--mut)}
.agentseg button.on{background:var(--gradsoft);color:var(--blue)}
.speak{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px 0 11px;border-radius:22px;border:1px solid var(--border2);color:var(--pilltxt);font-family:var(--disp);font-size:13px;font-weight:600}
.speak .mi{display:grid;place-items:center}
.speak svg{width:17px;height:17px;stroke:currentColor}
.speak:hover{border-color:var(--blue);color:var(--txt)}
.speak.live{background:var(--gradsoft);border-color:var(--green);color:var(--green)}
.speak.live .mi{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.65}}

.credchip{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;font-family:var(--disp);background:var(--gradsoft);border:1px solid rgba(134,224,0,.45);color:#4d8a12}
body:not(.light) .credchip{color:var(--green)}
.credchip .c{width:17px;height:17px;border-radius:50%;background:linear-gradient(160deg,#ffd166,#f5a524);display:grid;place-items:center;color:#5a3b00;font-size:10px;font-weight:800}

[data-art]{position:relative;overflow:hidden;background-repeat:no-repeat;background-size:cover;background-position:center}

.leanbar{display:flex;align-items:center;gap:20px;border:1px solid var(--border);border-radius:16px;
  padding:14px 18px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:.16s}
.leanbar:hover{border-color:var(--blue)}
.lb-art{width:104px;height:64px;border-radius:11px;flex:none}
.lb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lb-txt b{font-family:var(--disp);font-size:16px;font-weight:600}
.lb-txt span{font-size:12.8px;color:var(--mut)}
.lb-price{display:flex;align-items:center;gap:11px;flex:none;padding-right:20px;border-right:1px solid var(--border2)}
.lb-price b{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lb-cta{display:flex;align-items:center;gap:14px;flex:none}
.lb-cta .btn{height:40px;padding:0 20px;font-size:13.5px}
.lb-free{font-size:12.8px;color:var(--blue);font-weight:500;white-space:nowrap}
@media (max-width:1100px){.leanbar{flex-wrap:wrap}.lb-txt{flex:1 0 58%}.lb-price{border-right:0;padding-right:0}}
@media (max-width:820px){.lb-art{width:100%;height:120px}.lb-cta{width:100%}.lb-cta .btn{flex:1;justify-content:center}}

.cyc{display:inline-block;animation:cycin .42s cubic-bezier(.2,.8,.3,1)}
@keyframes cycin{from{opacity:0;transform:translateY(.24em)}to{opacity:1;transform:none}}

.tabbar{display:none}

/* ================= AI Tool page ================= */
.toolwrap{display:flex;align-items:stretch;min-height:calc(100vh - 66px)}
.tp-iconrail{width:58px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:5px;padding:20px 0;background:var(--railbg)}
.tp-iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.tp-iconbtn svg{width:18px;height:18px}
.tp-iconbtn:hover{background:var(--hover);color:var(--txt)}
.tp-iconbtn.on{background:var(--gradsoft);color:var(--blue)}
.tp-iconbtn.on svg{stroke:var(--blue)}
.tp-panel{width:360px;flex:none;padding:30px 26px 40px;border-right:1px solid var(--border);overflow:auto}
.tp-back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;font-weight:600;margin-bottom:14px}
.tp-back svg{width:14px;height:14px}
.tp-back:hover{color:var(--blue)}
.tp-title{display:flex;align-items:flex-start;gap:10px}
.tp-title h2{font-size:24px;font-weight:700;line-height:1.15;flex:1}
.tp-help{width:26px;height:26px;border-radius:50%;border:1px solid var(--border2);display:grid;place-items:center;color:var(--mut);flex:none;margin-top:2px}
.tp-help svg{width:14px;height:14px}
.tp-toolname{font-size:11.5px;color:var(--mut2);margin-top:5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tp-alt{font-size:12.5px;color:var(--blue);margin-top:6px}

.field{margin-top:22px}
.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}
.field .cnt{float:right;font-weight:400;font-size:11px;color:var(--mut2)}
.field .hint-tag{font-weight:400;color:var(--mut2);font-size:11.5px}

.dropzone{border:1px solid var(--border2);border-radius:14px;background:var(--surface2);min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.dropzone.dashed{border-style:dashed}
.dropzone .dzhead{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.dropzone .dzhead svg{width:16px;height:16px}
.dropzone .dzsub{font-size:11px;color:var(--mut2)}
.uploadbtn{height:38px;padding:0 16px;border-radius:9px;background:var(--blue);color:#04202c;font-family:var(--disp);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.uploadbtn svg{width:14px;height:14px}
.uploadbtn.ghost{background:none;border:1px solid var(--blue);color:var(--blue)}
.uploadrow{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.or{text-align:center;color:var(--mut2);font-size:11px;margin:8px 0}

.modetoggle,.chipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chipgrid.c2{grid-template-columns:repeat(2,1fr)}
.chipbtn{border:1px solid var(--border2);border-radius:10px;padding:10px 6px;text-align:center;font-size:12.8px;color:var(--pilltxt);background:var(--surface2)}
.chipbtn.on{background:var(--gradsoft);border-color:var(--blue);color:var(--blue);font-weight:600}

.toggletabs{display:flex;gap:10px}
.toggletab{flex:1;border:1px solid var(--border2);border-radius:12px;padding:12px;text-align:left;background:var(--surface2)}
.toggletab.on{border-color:var(--blue);background:var(--gradsoft)}
.toggletab svg{width:16px;height:16px;margin-bottom:6px;display:block}
.toggletab b{display:block;font-size:13px;font-family:var(--disp)}
.toggletab span{font-size:10.8px;color:var(--mut)}

.selectbox{height:44px;border-radius:10px;border:1px solid var(--inputbd);background:var(--input);padding:0 14px;display:flex;align-items:center;justify-content:space-between;color:var(--txt);font-size:13px}
.selectbox svg{width:13px;height:13px;stroke:var(--mut2);flex:none}
.fieldrow{display:flex;gap:12px}
.fieldrow .subfield{flex:1}
.fieldrow .subfield label{display:block;font-size:12px;font-weight:600;margin-bottom:8px}

.ta{width:100%;min-height:92px;border-radius:12px;border:1px solid var(--inputbd);background:var(--input);padding:11px 13px;color:var(--txt);font-size:13px;resize:vertical;font-family:var(--body)}
.ta::placeholder{color:var(--mut2)}
.hints{display:flex;gap:7px;margin-top:9px;overflow:hidden;align-items:center}
.hintchip{padding:6px 11px;border-radius:16px;background:var(--pill);border:1px solid var(--pillbd);font-size:11px;color:var(--pilltxt);white-space:nowrap;flex:none}
.hintrefresh{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--mut2);flex:none}
.hintrefresh svg{width:13px;height:13px}

.sliderfield .lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--mut2);margin-bottom:7px}
.sliderfield label span.info{color:var(--mut2);font-weight:400}
input[type=range]{width:100%;accent-color:var(--blue);height:4px}

.checkrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--pilltxt);cursor:pointer}
.checkrow input{width:16px;height:16px;accent-color:var(--blue)}

.tagsline{display:flex;gap:8px;flex-wrap:wrap}
.morelink{display:block;margin-top:9px;color:var(--blue);font-size:12px;font-weight:600}
.addtagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.genbtn{width:100%;height:47px;border-radius:12px;background:var(--grad);color:#05201c;font-family:var(--disp);font-weight:700;font-size:14px;margin-top:26px;text-align:center;display:flex;align-items:center;justify-content:center}
.gencredits{text-align:center;font-size:11.8px;color:var(--mut2);margin-top:10px}
.gencredits a{color:var(--blue);font-weight:600}

.tp-hero{flex:1;min-width:0;padding:38px 40px 50px}
.splitwrap{max-width:620px;margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--border);position:relative;aspect-ratio:16/10;display:flex}
.splitwrap .half{flex:1;position:relative;background-size:cover;background-position:center}
.splitwrap .divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,255,255,.7);z-index:2}
.tp-headline{text-align:center;margin-top:24px;font-size:25px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tp-sub2{text-align:center;color:var(--mut);font-size:13.5px;margin-top:7px;max-width:520px;margin-left:auto;margin-right:auto}
.tp-sugg{margin-top:40px;max-width:900px;margin-left:auto;margin-right:auto}

/* AI studio grid */
.studiogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.stgtile{border:1px solid var(--border);border-radius:14px;padding:24px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:var(--surface);position:relative;overflow:hidden;transition:all .18s ease;min-height:120px}
.stgtile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,14,.4),rgba(6,10,14,.88));z-index:1}
.stgtile>*{position:relative;z-index:2}
.stgtile b{font-family:var(--disp);font-size:14.5px;color:#fff}
.stgtile:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.stgtile:hover{border-color:var(--blue);transform:translateY(-2px)}
.stgtile .ic{width:42px;height:42px;border-radius:12px;background:var(--gradsoft);display:grid;place-items:center}
.stgtile .ic svg{width:22px;height:22px;stroke:var(--blue)}
.stgtile b{font-size:13px;font-family:var(--disp);font-weight:600}

/* placeholder screens */
.placewrap{padding:90px 40px;text-align:center}
.placewrap .ic{width:64px;height:64px;border-radius:18px;background:var(--gradsoft);display:grid;place-items:center;margin:0 auto 20px}
.placewrap .ic svg{width:30px;height:30px;stroke:var(--blue)}
.placewrap h2{font-size:24px;font-weight:700}
.placewrap p{color:var(--mut);font-size:14px;max-width:44ch;margin:10px auto 0}

/* passport (used on Home + Profile) */
.passport{margin:34px 40px 0;border-radius:18px;padding:1px;background:linear-gradient(120deg,rgba(134,224,0,.45),rgba(0,168,232,.45),rgba(0,168,232,0) 72%)}
.passport-in{background:var(--surface);border-radius:17px;padding:22px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.pp-id{display:flex;gap:14px;align-items:center;min-width:230px}
.pp-id .av{width:54px;height:54px;border-radius:14px;border:1px solid var(--border2);background-size:cover;background-position:center 20%}
.pp-id b{font-family:var(--disp);font-size:17px;font-weight:600;display:block}
.pp-id span{font-size:12px;color:var(--mut)}
.verified{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11px;color:#5c9b1f;border:1px solid rgba(134,224,0,.4);border-radius:20px;padding:3px 9px}
body:not(.light) .verified{color:#b7e77a}
.pp-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;flex:1;min-width:400px}
.st2 .k{font-family:var(--disp);font-size:20px;font-weight:600}
.st2 .l{font-size:11.5px;color:var(--mut2);margin-top:2px}
.st2 .k.g{color:#5c9b1f} body:not(.light) .st2 .k.g{color:var(--green)}
.st2 .k.b{color:var(--blue)} .st2 .k.a{color:#c47f05} body:not(.light) .st2 .k.a{color:var(--amber)}
.culture{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cu{border-radius:13px;border:1px solid var(--border);height:92px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;text-align:left}
.cu::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,14,.25),rgba(6,10,14,.9))}
.cu b{position:relative;z-index:2;font-family:var(--disp);font-size:13px;font-weight:600;color:#fff}
.cu:hover{border-color:var(--blue)}

/* ================= COURSE ================= */
/* home / create-home promo strip */
.coursestrip{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.cs-top{display:flex;gap:22px;padding:20px 22px;align-items:center;flex-wrap:wrap;background:radial-gradient(700px 260px at 6% 10%,var(--heroB),transparent 62%),radial-gradient(680px 280px at 96% 96%,var(--heroA),transparent 62%)}
.cs-art{width:150px;height:96px;border-radius:13px;flex:none;position:relative}
.cs-art .pl{position:absolute;inset:0;display:grid;place-items:center}
.cs-art .pl span{width:38px;height:38px;border-radius:50%;background:rgba(6,10,14,.6);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center}
.cs-art .pl svg{width:14px;height:14px;fill:#fff;stroke:#fff}
.cs-body{flex:1;min-width:230px}
.cs-body h3{font-size:22px;font-weight:700;line-height:1.2}
.cs-body p{color:var(--mut);font-size:13px;margin:7px 0 0;max-width:52ch}
.cs-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cs-meta span{font-size:11.5px;color:var(--pilltxt);border:1px solid var(--pillbd);background:var(--pill);border-radius:20px;padding:5px 11px}
.cs-buy{display:flex;flex-direction:column;gap:9px;flex:none;align-items:stretch;min-width:190px}
.cs-price{display:flex;align-items:baseline;gap:9px}
.cs-price .amt{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cs-price .sub{font-size:11px;color:var(--mut2)}
.cs-buy .btn{justify-content:center}
.cs-free{font-size:12.5px;color:var(--blue);font-weight:600;text-align:center}
.cs-rail{display:flex;gap:0;border-top:1px solid var(--border);overflow:auto}
.cs-day{flex:none;width:132px;padding:12px 14px;border-right:1px solid var(--border);text-align:left;position:relative}
.cs-day:hover{background:var(--hover)}
.cs-day .n{font-size:10px;letter-spacing:.14em;color:var(--mut2);font-weight:700;font-family:var(--disp)}
.cs-day b{display:block;font-size:12.2px;font-family:var(--disp);font-weight:600;margin-top:5px;line-height:1.3}
.cs-day .tl{font-size:10.5px;color:var(--mut2);margin-top:4px;display:block}
.cs-day .lk{position:absolute;top:11px;right:11px;color:var(--mut2)}
.cs-day .lk svg{width:12px;height:12px}
.cs-day.free .lk{color:var(--green)}
/* progress bar for owners */
.cs-prog{display:flex;align-items:center;gap:12px;padding:12px 22px;border-top:1px solid var(--border);background:var(--surface2)}
.cs-prog .bar{flex:1;height:6px;border-radius:4px;background:var(--pill);overflow:hidden}
.cs-prog .bar i{display:block;height:100%;background:var(--grad)}
.cs-prog b{font-size:12px;font-family:var(--disp);white-space:nowrap}

/* course landing */
.clwrap{max-width:1180px;margin:0 auto;padding:0 40px 60px}
.clhero{position:relative;overflow:hidden;padding:52px 40px 44px;border-bottom:1px solid var(--border);margin-bottom:34px}
.clhero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 74% -10%,var(--heroA),transparent 62%),radial-gradient(700px 340px at 12% 8%,var(--heroB),transparent 60%),var(--heroBase)}
.clhero>*{position:relative;z-index:2;max-width:1180px;margin-left:auto;margin-right:auto}
.clkick{font-family:var(--disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:700}
.clhero h1{font-size:41px;font-weight:700;line-height:1.1;margin-top:10px;max-width:20ch}
.clhero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.clhero .lede{color:var(--mut);font-size:15px;margin-top:14px;max-width:60ch}
.clcta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:24px}
.clcta .price{display:flex;align-items:baseline;gap:10px;padding-right:18px;border-right:1px solid var(--border2)}
.clcta .price .amt{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.clcta .price .sub{font-size:11.5px;color:var(--mut2)}
.clstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px}
.clstat{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--surface)}
.clstat .k{font-family:var(--disp);font-size:23px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.clstat .l{font-size:12px;color:var(--mut);margin-top:3px}
.clh2{font-size:22px;font-weight:700;margin:0 0 6px}
.clsubh{color:var(--mut);font-size:13.5px;margin:0 0 18px;max-width:62ch}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:36px}
.actcard{border:1px solid var(--border);border-radius:15px;padding:16px;background:var(--surface);text-align:left}
.actcard .tag{font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}
.actcard b{display:block;font-family:var(--disp);font-size:16px;font-weight:600;margin-top:7px}
.actcard span{font-size:12.2px;color:var(--mut);display:block;margin-top:5px;line-height:1.5}
.actcard .days{font-size:11px;color:var(--mut2);margin-top:10px;display:block}

/* curriculum list */
.curri{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);margin-bottom:34px}
.actband{padding:11px 18px;background:var(--surface2);border-bottom:1px solid var(--border);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.actband:first-child{border-top:0}
.actband b{font-family:var(--disp);font-size:12.5px;font-weight:700}
.actband span{font-size:11.5px;color:var(--mut2)}
.dayrow{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.dayrow:last-child{border-bottom:0}
.dayrow:hover{background:var(--hover)}
.dayrow .th{width:70px;height:44px;border-radius:8px;flex:none;position:relative;overflow:hidden}
.dayrow .th .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,10,14,.35)}
.dayrow .th .pl svg{width:13px;height:13px;fill:#fff;stroke:#fff}
.dayrow .num{font-family:var(--disp);font-size:11px;font-weight:700;color:var(--mut2);width:38px;flex:none}
.dayrow .txt{flex:1;min-width:0}
.dayrow .txt b{display:block;font-family:var(--disp);font-size:13.8px;font-weight:600}
.dayrow .txt span{font-size:11.8px;color:var(--mut);display:block;margin-top:2px}
.dayrow .tool{font-size:11px;color:var(--blue);border:1px solid rgba(0,168,232,.35);background:var(--gradsoft);border-radius:20px;padding:4px 10px;flex:none;white-space:nowrap}
.dayrow .dur{font-size:11.5px;color:var(--mut2);width:44px;text-align:right;flex:none}
.dayrow .state{width:24px;flex:none;display:grid;place-items:center;color:var(--mut2)}
.dayrow .state svg{width:14px;height:14px}
.dayrow .state.done{color:var(--green)}
.freepill{font-size:9.5px;font-weight:800;color:#05201c;background:var(--green);border-radius:4px;padding:2px 6px;flex:none}

/* checkout */
.cowrap{max-width:900px;margin:0 auto;padding:38px 40px 60px;display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start}
.copanel{border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:22px}
.copanel h3{font-size:18px;font-weight:700;margin-bottom:4px}
.copanel .sm{font-size:12.5px;color:var(--mut);margin-bottom:18px}
.paymethods{display:flex;flex-direction:column;gap:9px}
.pm{border:1px solid var(--border2);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface2)}
.pm.on{border-color:var(--blue);background:var(--gradsoft)}
.pm .ic{width:34px;height:34px;border-radius:9px;background:var(--pill);display:grid;place-items:center;flex:none;font-size:15px}
.pm b{display:block;font-family:var(--disp);font-size:13.5px;font-weight:600}
.pm span{font-size:11.5px;color:var(--mut)}
.pm .rd{margin-left:auto;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border2);flex:none;display:grid;place-items:center}
.pm.on .rd{border-color:var(--blue)}
.pm.on .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue)}
.orderline{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--border)}
.orderline.total{border-bottom:0;padding-top:14px;font-family:var(--disp);font-weight:700;font-size:16px}
.orderline .g{color:#5c9b1f} body:not(.light) .orderline .g{color:var(--green)}
.securenote{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--mut2);margin-top:14px}
.securenote svg{width:14px;height:14px;flex:none;margin-top:1px;stroke:var(--mut2)}

/* success */
.sucwrap{max-width:560px;margin:0 auto;padding:70px 40px;text-align:center}
.sucwrap .tick{width:76px;height:76px;border-radius:50%;background:var(--gradsoft);border:1px solid rgba(134,224,0,.5);display:grid;place-items:center;margin:0 auto 22px}
.sucwrap .tick svg{width:36px;height:36px;stroke:var(--green);stroke-width:2.4}
.sucwrap h2{font-size:27px;font-weight:700}
.sucwrap p{color:var(--mut);font-size:14px;margin:11px 0 0}
.sucgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}
.sucgrid div{border:1px solid var(--border);border-radius:13px;padding:14px;background:var(--surface)}
.sucgrid .k{font-family:var(--disp);font-size:20px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sucgrid .l{font-size:11.5px;color:var(--mut);margin-top:2px}

/* ---- lesson player ---- */
.plwrap{display:flex;align-items:stretch;min-height:calc(100vh - 66px)}
.syl{width:264px;flex:none;border-right:1px solid var(--border);background:var(--railbg);overflow:auto;padding:16px 12px 30px}
.sylhead{padding:6px 8px 14px}
.sylhead .bk{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;font-weight:600}
.sylhead .bk svg{width:13px;height:13px}
.sylhead .bk:hover{color:var(--blue)}
.sylhead b{display:block;font-family:var(--disp);font-size:15px;font-weight:700;margin-top:10px}
.sylprog{display:flex;align-items:center;gap:9px;margin-top:9px}
.sylprog .bar{flex:1;height:5px;border-radius:4px;background:var(--pill);overflow:hidden}
.sylprog .bar i{display:block;height:100%;background:var(--grad)}
.sylprog span{font-size:10.5px;color:var(--mut2);white-space:nowrap}
.sylact{font-family:var(--disp);font-size:9.6px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);font-weight:700;padding:14px 10px 6px}
.syld{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;color:var(--pilltxt)}
.syld:hover{background:var(--hover)}
.syld.on{background:var(--gradsoft);color:var(--blue)}
.syld .n{font-family:var(--disp);font-size:10.5px;font-weight:700;color:var(--mut2);width:26px;flex:none}
.syld.on .n{color:var(--blue)}
.syld .t{flex:1;min-width:0;font-size:12.3px;font-family:var(--disp);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syld .s{flex:none;color:var(--mut2)}
.syld .s svg{width:13px;height:13px}
.syld .s.done{color:var(--green)}
.syld.lock{opacity:.55}

.plmain{flex:1;min-width:0;padding:26px 30px 60px;overflow:auto}
.plhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.plhead .actbadge{font-family:var(--disp);font-size:9.6px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}
.plhead h1{font-size:27px;font-weight:700;line-height:1.15;margin-top:6px}
.plhead .hooksub{color:var(--mut);font-size:13.5px;margin-top:5px;font-style:italic}
.plhead .side{margin-left:auto;display:flex;gap:9px;align-items:center;flex:none}
.video{border-radius:16px;overflow:hidden;border:1px solid var(--border);position:relative;aspect-ratio:16/9;background:#05080b}
.video .pl{position:absolute;inset:0;display:grid;place-items:center}
.video .pl span{width:66px;height:66px;border-radius:50%;background:rgba(6,10,14,.55);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;backdrop-filter:blur(3px)}
.video .pl svg{width:24px;height:24px;fill:#fff;stroke:#fff;margin-left:3px}
.video .scrub{position:absolute;left:0;right:0;bottom:0;height:38px;background:linear-gradient(180deg,transparent,rgba(6,10,14,.85));display:flex;align-items:center;gap:10px;padding:0 14px;color:#dfe9f2;font-size:11px}
.video .scrub .bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.video .scrub .bar i{display:block;height:100%;width:0%;background:var(--grad)}
.video.playing .pl{display:none}

.lstabs{display:flex;gap:6px;margin:20px 0 14px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.lstab{padding:9px 14px;font-family:var(--disp);font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.lstab.on{color:var(--blue);border-bottom-color:var(--blue)}
.lsbody h4{font-family:var(--disp);font-size:14px;font-weight:700;margin:0 0 8px}
.lsbody p{color:var(--pilltxt);font-size:13.6px;line-height:1.65;margin:0 0 14px}
.lsbody ul{margin:0 0 14px;padding-left:18px;color:var(--pilltxt);font-size:13.4px;line-height:1.7}
.lsbody li{margin-bottom:5px}
.protip{border-left:2px solid var(--amber);background:var(--surface2);padding:12px 15px;border-radius:0 11px 11px 0;font-size:13px;color:var(--pilltxt);font-style:italic;margin-bottom:16px}
.protip b{font-style:normal;color:var(--txt);display:block;margin-bottom:4px;font-family:var(--disp);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}

.assign{border:1px solid rgba(0,168,232,.4);border-radius:16px;background:var(--gradsoft);padding:18px 20px;margin-top:6px}
.assign .kick{font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}
.assign h4{font-size:16px;font-weight:700;margin:8px 0 8px;font-family:var(--disp)}
.assign p{font-size:13.6px;color:var(--pilltxt);line-height:1.6;margin:0}
.assign .row{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:15px}
.assign .cost{font-size:11.5px;color:var(--mut);border:1px solid var(--pillbd);background:var(--pill);border-radius:20px;padding:5px 11px}
.carry{font-size:12.3px;color:var(--mut);margin-top:14px;padding-left:12px;border-left:2px solid var(--border2);font-style:italic}

/* create-along dock */
.dock{width:390px;flex:none;border-left:1px solid var(--border);background:var(--railbg);overflow:auto;padding:22px 22px 50px}
.dockhead{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.dockhead .kick{font-family:var(--disp);font-size:9.6px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:700}
.dock h3{font-size:19px;font-weight:700;line-height:1.2}
.docktool{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:4px}
.docknote{font-size:12.3px;color:var(--mut);margin-top:10px;line-height:1.55;padding:11px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface)}
.dockdone{margin-top:14px;width:100%;height:42px;border-radius:11px;border:1px solid var(--border2);color:var(--pilltxt);font-family:var(--disp);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.dockdone:hover{border-color:var(--green);color:var(--green)}
.dockdone.done{background:var(--gradsoft);border-color:var(--green);color:var(--green)}
.dockdone svg{width:15px;height:15px}
.docklock{text-align:center;padding:40px 14px;color:var(--mut2);font-size:12.5px;line-height:1.6}
.docklock .ic{width:46px;height:46px;border-radius:14px;background:var(--pill);display:grid;place-items:center;margin:0 auto 14px}
.docklock .ic svg{width:20px;height:20px;stroke:var(--mut2)}

/* paywall modal body */
.pwbody{padding:22px 24px 24px;text-align:center}
.pwbody .ic{width:56px;height:56px;border-radius:16px;background:var(--gradsoft);display:grid;place-items:center;margin:0 auto 16px}
.pwbody .ic svg{width:26px;height:26px;stroke:var(--blue)}
.pwbody h3{font-size:21px;font-weight:700}
.pwbody p{color:var(--mut);font-size:13.5px;margin:9px 0 0}

@media (max-width:1380px){ .dock{width:340px} }
@media (max-width:1180px){
  .plwrap{flex-wrap:wrap}
  .syl{width:100%;height:auto;border-right:0;border-bottom:1px solid var(--border);display:flex;gap:8px;overflow:auto;padding:12px}
  .sylhead,.sylact{display:none}
  .syld{width:auto;flex:none}
  .syld .t{max-width:130px}
  .dock{width:100%;border-left:0;border-top:1px solid var(--border)}
  .cowrap{grid-template-columns:1fr}
}
/* ================= CAMPAIGN / TALENT HUNT ================= */
/* hero row: ask box + carousel side by side */
.herorow{display:flex;gap:26px;align-items:stretch;margin-top:30px}
.herorow .askcol{flex:1;min-width:0}
.herorow .askcol .ask{margin-top:0}
.carousel{width:372px;flex:none;position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border2);min-height:280px}
.cslide{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none;background-size:cover;background-position:center;display:flex;align-items:flex-end}
.cslide.on{opacity:1;pointer-events:auto}
.cslide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,14,.35) 20%,rgba(6,10,14,.93))}
.csin{position:relative;z-index:2;padding:20px;width:100%}
.csbadge{font-family:var(--disp);font-size:8.8px;letter-spacing:.18em;font-weight:700;color:#cfe9ff;background:rgba(8,14,20,.7);border:1px solid rgba(255,255,255,.2);padding:4px 9px;border-radius:5px}
.csin h3{font-size:25px;font-weight:700;color:#fff;margin-top:11px}
.csin p{font-size:12.4px;color:#b9c8d6;margin:7px 0 0;line-height:1.5}
.cscount{display:inline-flex;align-items:center;gap:7px;margin-top:11px;font-size:11.5px;font-weight:600;color:#b7e77a;background:rgba(8,14,20,.6);border:1px solid rgba(134,224,0,.4);border-radius:20px;padding:5px 11px}
.cscount i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px #86e000;animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
.csbtns{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.csbtns .btn{height:38px;padding:0 16px;font-size:13px}
.csbtns .btn.ghost{border-color:rgba(255,255,255,.35);color:#fff;background:rgba(8,14,20,.4)}
.csdots{position:absolute;top:16px;right:16px;z-index:4;display:flex;gap:6px}
.csdots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.csdots button.on{background:#fff;width:18px;border-radius:4px}

/* talent hunt hub */
.thhero{position:relative;overflow:hidden;padding:50px 40px 42px;border-bottom:1px solid var(--border);margin-bottom:34px}
.thhero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 78% -12%,var(--heroA),transparent 62%),radial-gradient(700px 340px at 10% 6%,var(--heroB),transparent 60%),var(--heroBase)}
.thhero>*{position:relative;z-index:2;max-width:1180px;margin:0 auto}
.thhero h1{font-size:42px;font-weight:700;line-height:1.1;margin-top:10px}
.thhero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.thcounter{display:grid;grid-template-columns:repeat(3,auto);gap:34px;margin-top:26px;justify-content:start}
.thcounter .k{font-family:var(--disp);font-size:31px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.thcounter .l{font-size:11.5px;color:var(--mut);margin-top:3px;max-width:24ch}

.campgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:36px}
.campcard{border-radius:18px;overflow:hidden;border:1px solid var(--border);position:relative;min-height:330px;display:flex;align-items:flex-end;background-size:cover;background-position:center}
.campcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,14,.3) 18%,rgba(6,10,14,.95))}
.campcard:hover{border-color:var(--blue)}
.ccin{position:relative;z-index:2;padding:24px;width:100%}
.ccin h3{font-size:28px;font-weight:700;color:#fff;margin-top:12px}
.ccid{font-size:11.5px;color:#9fb2c2;margin-top:5px;font-weight:600}
.ccin p{font-size:13.2px;color:#c3d0dc;margin:10px 0 0;max-width:40ch;line-height:1.55}
.ccnote{font-size:11.5px;color:#8e9dab;margin-top:13px;font-style:italic}

.stepgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:36px}
.stepcard{border:1px solid var(--border);border-radius:15px;padding:17px;background:var(--surface)}
.stepcard .n{font-family:var(--disp);font-size:11px;font-weight:800;color:#05201c;background:var(--grad);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.stepcard b{display:block;font-family:var(--disp);font-size:14.5px;font-weight:600;margin-top:11px}
.stepcard span{display:block;font-size:12.2px;color:var(--mut);margin-top:5px;line-height:1.55}

.campchip{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-size:11.3px;font-weight:600;color:#4d8a12;background:var(--gradsoft);border:1px solid rgba(134,224,0,.45);border-radius:20px;padding:5px 11px}
body:not(.light) .campchip{color:var(--green)}
.campchip i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px #86e000;animation:blip 1.6s ease-in-out infinite}

/* campaign feeds */
.feedsort{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.sortbtn{padding:7px 14px;border-radius:20px;border:1px solid var(--pillbd);background:var(--pill);font-size:12.5px;color:var(--pilltxt);font-family:var(--disp);font-weight:500}
.sortbtn.on{background:var(--gradsoft);border-color:var(--blue);color:var(--blue);font-weight:600}
.seednote{margin-left:auto;font-size:11.3px;color:var(--mut2);max-width:44ch}
.feedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:30px}
.fcard{border-radius:14px;border:1px solid var(--border);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.fcard:hover{border-color:var(--blue)}
.fcard .still{height:220px;position:relative}
.fcard .badge{position:absolute;top:10px;right:10px;background:rgba(8,14,20,.7);border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:5px;display:grid;place-items:center}
.fcard .badge svg{width:14px;height:14px;stroke:#cfdae4}
.fcard .seedtag{position:absolute;top:10px;left:10px;font-size:8.8px;font-weight:800;letter-spacing:.12em;color:#cfe9ff;background:rgba(8,14,20,.72);border:1px solid rgba(255,255,255,.2);padding:3px 7px;border-radius:4px}
.fcard .dur{position:absolute;right:10px;bottom:44px;background:rgba(6,10,14,.8);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:5px}
.fcard .cap{position:absolute;left:0;right:0;bottom:0;padding:12px;background:linear-gradient(180deg,transparent,rgba(6,10,14,.94));font-size:13.2px;font-weight:500;color:#fff}
.fcard .who{display:flex;align-items:center;gap:8px;padding:11px 12px 0;font-size:11.8px;color:var(--mut)}
.fcard .who .av{width:22px;height:22px;border-radius:50%;background-size:cover;flex:none}
.fcard .acts{padding:11px 12px 12px;display:flex;flex-wrap:wrap;gap:7px}
.fcard .acts .pill{font-size:11.5px;padding:6px 10px}
.pinnedcta{border:1px solid var(--border);border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:radial-gradient(600px 240px at 6% 20%,var(--heroB),transparent 62%),var(--surface)}
.pinnedcta b{font-family:var(--disp);font-size:16px;display:block}
.pinnedcta span{font-size:12.8px;color:var(--mut);display:block;margin-top:4px}
.pinnedcta .btn{margin-left:auto}

/* new form field types */
.segmented{display:flex;border:1px solid var(--inputbd);border-radius:10px;overflow:hidden}
.segbtn{flex:1;padding:11px 0;font-family:var(--disp);font-size:13.5px;font-weight:600;color:var(--pilltxt);border-right:1px solid var(--inputbd);background:var(--input)}
.segbtn:last-child{border-right:0}
.segbtn.on{background:var(--blue);color:#04202c}
.tin{width:100%;height:44px;border-radius:10px;border:1px solid var(--inputbd);background:var(--input);padding:0 13px;color:var(--txt);font-size:13px;font-family:var(--body)}
.tin::placeholder{color:var(--mut2)}
.fnote{font-size:11.3px;color:var(--mut2);margin-top:7px;line-height:1.5}
.talink{float:right;font-size:11.5px;font-weight:600;color:var(--blue);background:var(--gradsoft);border:1px solid rgba(0,168,232,.3);border-radius:8px;padding:5px 11px;font-family:var(--disp)}
.mini .dur{position:absolute;right:6px;bottom:6px;z-index:3;background:rgba(6,10,14,.8);color:#fff;font-size:10px;padding:2px 6px;border-radius:5px}
.emptybox{border:1px solid var(--border);border-radius:16px;padding:38px 24px;text-align:center;background:var(--surface)}
.emptybox .eic{width:56px;height:56px;border-radius:16px;background:var(--gradsoft);display:grid;place-items:center;margin:0 auto 16px}
.emptybox .eic svg{width:26px;height:26px;stroke:var(--blue)}
.emptybox b{font-family:var(--disp);font-size:17px;font-weight:700}
.emptybox p{color:var(--mut);font-size:13px;margin:8px 0 18px;max-width:42ch;margin-left:auto;margin-right:auto}

/* NEW badge in sidebar */
.newbdg{font-size:8.4px;font-weight:800;letter-spacing:.1em;color:#05201c;background:var(--grad);border-radius:4px;padding:2px 5px;margin-left:7px;vertical-align:middle}

@media (max-width:1240px){
  .herorow{flex-direction:column}
  .carousel{width:100%;min-height:250px}
  .campgrid{grid-template-columns:1fr}
  .stepgrid{grid-template-columns:1fr 1fr}
}
/* collapsible rail */
.railtoggle{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--mut);flex:none}
.railtoggle:hover{background:var(--hover);color:var(--txt)}
.railtoggle svg{width:19px;height:19px}
body.railclosed .rail{width:72px;padding:16px 10px}
body.railclosed .rail .lbl,body.railclosed .sub,body.railclosed .railnote{display:none}
body.railclosed .nav{justify-content:center;padding:12px}
body.railclosed .railbottom{border-top:1px solid var(--border);padding-top:10px}
.rail{transition:width .18s ease}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}

@media (max-width:1480px){
  .outcomes,.culture{grid-template-columns:repeat(4,1fr)}
  .packs{grid-template-columns:repeat(4,1fr)}
  .bigcards{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:1160px){
  .rail{width:72px;padding:16px 10px}
  .rail .lbl,.sub,.railnote{display:none}
  .nav{justify-content:center;padding:12px}
  .hero h1{font-size:38px}
  .tp-iconrail{display:none}
}
@media (max-width:980px){
  .toolwrap{flex-direction:column}
  .tp-panel{width:100%;border-right:0;border-bottom:1px solid var(--border)}
}
@media (max-width:820px){
  .rail{display:none}
  .hero,.sec{padding-left:18px;padding-right:18px}
  .passport,.banner,.note{margin-left:18px;margin-right:18px}
  .hero h1{font-size:30px}
  .outcomes,.culture,.bigcards{grid-template-columns:1fr 1fr}
  .clstats{grid-template-columns:1fr 1fr}
  .clhero,.clwrap,.cowrap,.plmain,.sucwrap{padding-left:18px;padding-right:18px}
  .clhero h1{font-size:29px}
  .dayrow .tool,.dayrow .th{display:none}
  .plhead h1{font-size:22px}
  .search,.subscribe{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;height:64px;background:var(--topbg);backdrop-filter:blur(12px);border-top:1px solid var(--border2)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--mut);font-family:var(--disp)}
  .tabbar button svg{width:21px;height:21px;stroke:var(--mut)}
  .tabbar button.on,.tabbar button.on svg{color:var(--blue);stroke:var(--blue)}
  body{padding-bottom:64px}
  .notebtn{bottom:76px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* phones: keep the top bar and passport stats inside the screen (they pushed the page ~90px wider than the viewport) */
@media(max-width:480px){.top{gap:10px;padding:0 12px}.topright{gap:8px}#themeseg,.top .iconbtn{display:none}}
@media(max-width:820px){.pp-stats{min-width:0;grid-template-columns:repeat(3,1fr);gap:12px}}
/* ================= TALK WITH TANU ================= */
/* home hero: ask column + Tanu banner */
.hero.tnhero{padding-top:58px;padding-bottom:50px}
.tnhero .herorow{align-items:center;margin-top:0;gap:34px}
.tnhero .homecol{text-align:center}
.tnhero .homecol h1{margin:0 auto}
.tnhero .homecol .ask{margin:30px auto 0;text-align:left}
.tnhero .homecol .chips{justify-content:center}

/* Tanu avatar (photo if assets/tanu.jpg exists, animated voice orb underneath as fallback) */
.tn-av{position:relative;flex:none;border-radius:50%;width:44px;height:44px}
.tn-av.lg{width:74px;height:74px}
.tn-av.xs{width:30px;height:30px}
.tn-av .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,#d9f99d 0,#86e000 22%,#00a8e8 62%,#0b3d63 100%);box-shadow:0 0 0 3px rgba(0,168,232,.14),0 10px 30px rgba(0,168,232,.28);overflow:hidden}
.tn-av .orb::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.35),transparent 40%);animation:tnspin 6s linear infinite}
.tn-av .eq{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9%;z-index:2}
.tn-av .eq i{width:8%;height:22%;border-radius:4px;background:rgba(255,255,255,.92);animation:tneq 1.2s ease-in-out infinite}
.tn-av .eq i:nth-child(2){animation-delay:.15s}.tn-av .eq i:nth-child(3){animation-delay:.3s}.tn-av .eq i:nth-child(4){animation-delay:.45s}
.tn-av .ph{position:absolute;inset:0;border-radius:50%;background-size:cover;background-position:center;z-index:3}
.tn-av::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--green);opacity:0;z-index:0}
.tn-av.talk::before{animation:tnring 1.1s ease-out infinite}
.tn-av.talk .eq i{animation-duration:.5s}
.tn-av .dot{position:absolute;right:1px;bottom:1px;width:22%;height:22%;min-width:9px;min-height:9px;border-radius:50%;background:var(--green);border:2px solid var(--surface);z-index:4}
@keyframes tnspin{to{transform:rotate(360deg)}}
@keyframes tneq{0%,100%{height:18%}50%{height:52%}}
@keyframes tnring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}

/* hero banner */
.tnb{width:372px;flex:none;position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border2);padding:18px 18px 16px;cursor:pointer;text-align:left;
  background:linear-gradient(180deg,rgba(6,10,14,.05) 0%,rgba(6,10,14,.55) 34%,rgba(6,10,14,.94) 56%,#080b10 100%),url('assets/tanu_scene.jpg') center 18%/cover no-repeat,#080b10;transition:border-color .2s,transform .2s}
.tnb:hover{border-color:var(--blue);transform:translateY(-3px)}
.tnb-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tnb-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#b7e77a}
.tnb-live i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px #86e000;animation:blip 1.6s ease-in-out infinite}
.tnb-main{display:flex;gap:12px;align-items:center;margin-top:118px}
.tnb-top .csbadge{background:rgba(8,14,20,.75)}
.tnb-live{background:rgba(8,14,20,.7);border-radius:20px;padding:4px 9px}
.tnb .tn-av{box-shadow:0 0 0 2px rgba(255,255,255,.85);border-radius:50%}
.tnb h3{font-size:24px;font-weight:700;color:#fff;line-height:1.1}
.tnb p{font-size:12.6px;color:#b9c8d6;margin:6px 0 0;line-height:1.5}
.tnb-jar{display:flex;align-items:center;gap:14px;margin-top:14px;padding:10px 12px;border-radius:14px;background:rgba(8,14,20,.55);border:1px solid rgba(255,255,255,.08)}
.tnb-jar svg{width:52px;height:68px;flex:none}
.tnb-amt{font-family:var(--disp);font-size:24px;font-weight:700;color:#ffd166;line-height:1}
.tnb-amt span{font-size:13px;color:#8fa2b3;font-weight:600}
.tnb-dots{display:flex;gap:5px;margin-top:8px}
.tnb-dots i{width:20px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.tnb-dots i.on{background:linear-gradient(90deg,#ffd166,#f5a524)}
.tnb-meta{font-size:11px;color:#8fa2b3;margin-top:7px}
.tnb .btn{width:100%;justify-content:center;margin-top:14px;height:42px}
.tnb-fine{font-size:10.8px;color:#7f91a2;text-align:center;margin-top:9px}
@media(max-width:980px){.tnb{width:100%}}

/* jar */
.tn-jarsvg .row{transform-box:fill-box}
.tn-jarsvg .row.drop{animation:tndrop .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes tndrop{0%{transform:translateY(-70px);opacity:0}60%{opacity:1}100%{transform:none}}
.tn-jarbox.shake{animation:tnshake .5s ease}
@keyframes tnshake{0%,100%{transform:none}25%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}}
.tn-coin{position:fixed;left:0;top:0;z-index:300;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffd166 40%,#e0951b);border:2px solid #b8740c;color:#6b4300;font:800 13px/22px var(--disp);text-align:center;pointer-events:none;box-shadow:0 4px 14px rgba(245,165,36,.5)}

/* modal shell */
.tn-modal .tn-sheet{position:relative;z-index:2;width:min(1060px,calc(100% - 32px));height:min(780px,92vh);margin:4vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.2,.8,.3,1)}
.tn-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex:none}
.tn-head .who{min-width:0}
.tn-head .who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn-headjar{white-space:nowrap}
.tn-head .who b{display:block;font-family:var(--disp);font-size:15px}
.tn-head .who span{font-size:11.8px;color:var(--mut)}
.tn-head .who span.talk{color:var(--green)}
.tn-headjar{margin-left:auto;display:none;align-items:center;gap:6px;font-family:var(--disp);font-weight:700;font-size:13px;color:#b8740c;background:rgba(245,165,36,.12);border:1px solid rgba(245,165,36,.4);border-radius:20px;padding:5px 11px}
body:not(.light) .tn-headjar{color:#ffd166}
.tn-demo{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--amber);border:1px solid rgba(245,165,36,.45);border-radius:5px;padding:3px 7px}
.tn-iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);display:grid;place-items:center;color:var(--mut);flex:none}
.tn-iconbtn:hover{color:var(--txt);border-color:var(--blue)}
.tn-iconbtn svg{width:17px;height:17px}
.tn-head .sp{margin-left:auto}
.tn-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr)}
.tn-main{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--border)}
.tn-chat{flex:1;overflow-y:auto;padding:22px 22px 10px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}

/* messages */
.tn-msg{display:flex;gap:10px;align-items:flex-end;max-width:min(560px,92%);animation:tnin .32s cubic-bezier(.2,.8,.3,1)}
@keyframes tnin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tn-msg.me{align-self:flex-end;flex-direction:row-reverse}
.tn-bub{background:var(--surface2);border:1px solid var(--border2);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.55}
.tn-msg.me .tn-bub{background:var(--gradsoft);border-color:rgba(0,168,232,.35);border-radius:16px 16px 4px 16px}
.tn-tag{display:inline-block;font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.tn-qn{font-family:var(--disp);font-size:11px;font-weight:700;color:var(--mut2);margin-right:8px}
.tn-q{font-family:var(--disp);font-weight:500;font-size:15px}
.tn-bubacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tn-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;font-family:var(--disp);color:var(--pilltxt);border:1px solid var(--pillbd);background:var(--pill);border-radius:20px;padding:5px 11px}
.tn-chip svg{width:14px;height:14px}
.tn-chip:hover,.tn-chip.on{border-color:var(--blue);color:var(--blue)}
.tn-script{margin-top:10px;padding:11px 13px;border-radius:12px;background:var(--bg);border:1px dashed var(--border2);font-size:13.5px;line-height:1.7;color:var(--txt)}
.tn-script small{display:block;font-size:11px;color:var(--mut2);margin-bottom:5px;font-weight:600}
.tn-sys{align-self:center;font-size:11.8px;color:var(--mut);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
.tn-typing{display:inline-flex;gap:4px;padding:4px 2px}
.tn-typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:tntype 1s infinite}
.tn-typing i:nth-child(2){animation-delay:.15s}.tn-typing i:nth-child(3){animation-delay:.3s}
@keyframes tntype{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}

/* answer bubble */
.tn-ans{min-width:min(330px,70vw)}
.tn-play{display:flex;align-items:center;gap:10px}
.tn-pbtn{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#05201c;display:grid;place-items:center;flex:none}
.tn-pbtn svg{width:14px;height:14px}
.tn-pbtn[disabled]{opacity:.4}
.tn-wf{position:relative;flex:1;height:30px}
.tn-wf .bars{position:absolute;inset:0;display:flex;align-items:center;gap:2px}
.tn-wf .bars i{flex:1;border-radius:2px;background:var(--mut2);min-height:3px}
.tn-wf .bars.fg{clip-path:inset(0 100% 0 0)}
.tn-wf .bars.fg i{background:var(--blue)}
.tn-dur{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.tn-qual{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tn-qual span{font-size:11px;font-weight:600;border-radius:12px;padding:3px 9px;border:1px solid var(--border2);color:var(--mut)}
.tn-qual span.g{color:#4d8a12;border-color:rgba(134,224,0,.45)}
body:not(.light) .tn-qual span.g{color:#b7e77a}
.tn-qual span.w{color:#b8740c;border-color:rgba(245,165,36,.45)}
.tn-qual span.b{color:#e5484d;border-color:rgba(229,72,77,.45)}
.tn-score{font-family:var(--disp);font-weight:700}
.tn-trans{font-size:12.6px;color:var(--mut);margin-top:9px;font-style:italic;line-height:1.5}
.tn-paid{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;font-weight:700;color:#b8740c}
body:not(.light) .tn-paid{color:#ffd166}

/* cards inside chat */
.tn-card{align-self:stretch;margin-left:54px;border:1px solid var(--border2);border-radius:16px;padding:16px;background:var(--surface2);animation:tnin .32s ease}
.tn-card h4{font-family:var(--disp);font-size:15px;font-weight:600;margin-bottom:10px}
.tn-card h4{display:flex;align-items:center;gap:8px}
.tn-card h4 svg,.tn-cardbtns .btn svg{width:17px;height:17px;flex:none}
.tn-card h4 svg{color:var(--green)}
.tn-cardbtns .btn{gap:7px}
.tn-langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tn-lang{border:1px solid var(--border2);border-radius:14px;padding:14px;text-align:left;background:var(--surface)}
.tn-lang:hover{border-color:var(--blue)}
.tn-lang b{display:block;font-family:var(--disp);font-size:17px}
.tn-lang span{font-size:12px;color:var(--mut)}
.tn-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tn-fact{font-size:12.4px;color:var(--mut);line-height:1.5}
.tn-fact b{display:block;color:var(--txt);font-family:var(--disp);font-size:13px;margin-bottom:2px}
.tn-check{display:flex;gap:10px;align-items:flex-start;font-size:13.2px;padding:7px 0;cursor:pointer}
.tn-check input{margin-top:3px;accent-color:#00a8e8;width:16px;height:16px;flex:none}
.tn-cardbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tn-cardbtns .btn{height:40px;font-size:13.5px}
.tn-cardbtns .btn[disabled]{opacity:.45;pointer-events:none}
.tn-meter{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--border2);overflow:hidden;margin:4px 0 10px}
.tn-meter i{display:block;height:100%;width:0;background:var(--grad);transition:width .08s}
.tn-checkmsg{font-size:13px;color:var(--mut)}
.tn-checkmsg b{color:var(--txt)}

/* composer */
.tn-comp{flex:none;border-top:1px solid var(--border);padding:14px 18px 16px;background:var(--surface)}
.tn-comp:empty{display:none}
.tn-idle{display:flex;align-items:center;gap:14px}
.tn-mic{width:58px;height:58px;border-radius:50%;background:var(--grad);color:#05201c;display:grid;place-items:center;flex:none;box-shadow:0 8px 26px rgba(0,168,232,.3);transition:transform .15s}
.tn-mic:hover{transform:scale(1.06)}
.tn-mic svg{width:24px;height:24px}
.tn-idle b{display:block;font-family:var(--disp);font-size:15px}
.tn-idle span{font-size:12.2px;color:var(--mut)}
.tn-idle .tn-chip{margin-left:auto}
.tn-prompter{height:96px;overflow:hidden;border-radius:12px;background:var(--bg);border:1px solid var(--border2);padding:10px 14px;margin-bottom:12px;position:relative;mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
.tn-prompter-in{font-size:15.5px;line-height:1.75;transition:transform .4s linear}
.tn-caption{min-height:44px;max-height:72px;overflow:hidden;font-size:14px;line-height:1.55;color:var(--txt);margin-bottom:12px;display:flex;flex-direction:column;justify-content:flex-end}
.tn-caption em{color:var(--mut);font-style:normal}
.tn-recrow{display:flex;align-items:center;gap:14px}
.tn-ring{position:relative;width:62px;height:62px;flex:none}
.tn-ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.tn-ring .bg{stroke:var(--border2)}
.tn-ring .fg{stroke:var(--blue);transition:stroke .3s}
.tn-ring.ok .fg{stroke:var(--green)}
.tn-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:13px;font-variant-numeric:tabular-nums}
.tn-recdot{width:9px;height:9px;border-radius:50%;background:#e5484d;animation:blip 1s infinite;flex:none}
.tn-paused .tn-recdot{animation:none;background:var(--mut2)}
.tn-wave{flex:1;min-width:0;height:52px}
.tn-recbtns{display:flex;gap:8px;flex:none}
.tn-recbtns .btn{height:42px;padding:0 16px;font-size:13.5px;gap:6px}
.tn-recbtns .btn svg{width:15px;height:15px}
.tn-recbtns .btn[disabled]{opacity:.4;pointer-events:none}
.tn-hint{font-size:12px;color:var(--mut);margin-top:9px;min-height:16px}
.tn-hint.warn{color:var(--amber)}
.tn-hint.ok{color:#4d8a12}
body:not(.light) .tn-hint.ok{color:#b7e77a}
.tn-reviewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tn-reviewbar .msg{font-size:12.6px;color:var(--mut);flex:1;min-width:180px}
.tn-reviewbar .btn{height:44px;gap:6px;white-space:nowrap}
.tn-reviewbar .btn svg{width:16px;height:16px}

/* side panel */
.tn-side{overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;align-items:center;background:radial-gradient(300px 220px at 50% 0%,rgba(245,165,36,.10),transparent 70%)}
.tn-jarbox{width:132px;height:172px}
.tn-jarbox svg{width:100%;height:100%}
.tn-amt{font-family:var(--disp);font-size:30px;font-weight:700;color:#c77d0a;margin-top:6px;line-height:1}
body:not(.light) .tn-amt{color:#ffd166}
.tn-amt span{font-size:14px;color:var(--mut);font-weight:600}
.tn-amtsub{font-size:12px;color:var(--mut);margin-top:6px;text-align:center}
.tn-steps{list-style:none;width:100%;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tn-steps li{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;border:1px solid var(--border);font-size:12.6px;color:var(--mut)}
.tn-steps li .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:11px;font-weight:700;border:1px solid var(--border2);flex:none}
.tn-steps li b{display:block;color:var(--txt);font-family:var(--disp);font-weight:500;font-size:12.8px}
.tn-steps li small{font-size:11px;color:var(--mut2)}
.tn-steps li .r{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--mut2)}
.tn-steps li.cur{border-color:var(--blue);background:var(--gradsoft)}
.tn-steps li.cur .n{border-color:var(--blue);color:var(--blue)}
.tn-steps li.done .n{background:var(--grad);border:0;color:#05201c}
.tn-steps li.done .r{color:#c77d0a}
body:not(.light) .tn-steps li.done .r{color:#ffd166}
.tn-why{margin-top:18px;font-size:12px;color:var(--mut);line-height:1.55;border-top:1px solid var(--border);padding-top:14px}
.tn-why b{color:var(--txt)}

/* payout */
.tn-pay .big{font-family:var(--disp);font-size:40px;font-weight:700;line-height:1;background:linear-gradient(135deg,#ffd166,#f5a524);-webkit-background-clip:text;background-clip:text;color:transparent}
.tn-paystats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tn-paystats div{border:1px solid var(--border2);border-radius:12px;padding:9px 10px;background:var(--surface)}
.tn-paystats b{display:block;font-family:var(--disp);font-size:16px}
.tn-paystats span{font-size:11px;color:var(--mut)}
.tn-opt{display:flex;gap:10px;align-items:center;border:1px solid var(--border2);border-radius:12px;padding:11px 12px;margin-top:8px;cursor:pointer;font-size:13px;background:var(--surface)}
.tn-opt input{accent-color:#00a8e8}
.tn-opt b{font-family:var(--disp)}
.tn-opt span{color:var(--mut);font-size:12px}
.tn-upi{width:100%;height:42px;margin-top:10px;border-radius:10px;border:1px solid var(--inputbd);background:var(--input);color:var(--txt);padding:0 12px;font-size:13.5px}
.tn-fine{font-size:11.5px;color:var(--mut2);margin-top:12px;line-height:1.5}
.tn-link{font-size:12px;color:var(--blue);margin-top:8px;text-decoration:underline}
.tn-badge{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:12px;border:1px solid rgba(134,224,0,.4);background:var(--gradsoft);font-size:12.6px}
.tn-badge b{display:block;font-family:var(--disp);font-size:14px}

@media(max-width:820px){
  .tn-modal .tn-sheet{width:100%;height:100%;margin:0;border-radius:0;border:0}
  .tn-body{grid-template-columns:1fr}
  .tn-side{display:none}
  .tn-main{border-right:0}
  .tn-headjar{display:inline-flex}
  .tn-head .sp{margin-left:0}
  .tn-head{gap:8px;padding:10px 12px}
  .tn-head .tn-av{width:36px;height:36px}
  .tn-demo{display:none}
  .tn-body{grid-template-columns:minmax(0,1fr)}
  .tn-chat{padding:16px 14px 8px}
  .tn-card{margin-left:0}
  .tn-facts,.tn-langs{grid-template-columns:1fr}
  .tn-recrow{flex-wrap:wrap}
  .tn-wave{order:3;flex-basis:100%}
  .tn-recbtns{margin-left:auto}
  .tn-idle .tn-chip{display:none}
  .tn-paystats{grid-template-columns:1fr 1fr 1fr}
}

/* ================= EROS AIVIDYA — learning platform ================= */
.av{--gold:#f5b942;--av1:#7c5cff}
.av-wrap{max-width:1240px;margin:0 auto;padding:0 40px}
.av-sec{padding:44px 0 0}
.av-sechead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.av-sechead h2{font-size:23px;font-weight:700;line-height:1.2}
.av-sechead p{font-size:13.5px;color:var(--mut);margin-top:4px}
.av-sechead .more{margin-left:auto;color:var(--blue);font-size:13px;font-weight:600;white-space:nowrap;font-family:var(--disp)}
.av-kick{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.av-grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.av .btn svg{width:16px;height:16px}
.av .btn{gap:8px}
.av-ic{display:inline-grid;place-items:center}
.av-ic svg{width:18px;height:18px}

/* hero */
.av-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.av-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 460px at 85% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 0% 0%,var(--heroA),transparent 60%),var(--heroBase)}
.av-hero .av-wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding-top:54px;padding-bottom:50px}
.av-hero h1{font-size:46px;line-height:1.06;font-weight:700;margin-top:14px}
.av-hero .lede{font-size:16px;color:var(--mut);margin-top:16px;max-width:52ch;line-height:1.6}
.av-search{display:flex;align-items:center;gap:10px;margin-top:26px;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:7px 7px 7px 16px;box-shadow:0 14px 40px rgba(0,0,0,.18);max-width:580px}
.av-search svg{width:19px;height:19px;color:var(--mut);flex:none}
.av-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-size:15px;height:42px}
.av-search .btn{height:44px}
.av-pop{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.av-pop span{font-size:12px;color:var(--mut2)}
.av-chip{padding:7px 13px;border-radius:20px;border:1px solid var(--pillbd);background:var(--pill);font-size:12.5px;color:var(--pilltxt);font-family:var(--disp);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.av-chip:hover{border-color:var(--blue);color:var(--txt)}
.av-chip.on{background:var(--gradsoft);border-color:var(--blue);color:var(--blue);font-weight:600}
.av-chip svg{width:14px;height:14px}
.av-heroart{position:relative;border-radius:22px;aspect-ratio:4/3.3;background-size:cover;background-position:center;border:1px solid var(--border2);box-shadow:0 30px 70px rgba(0,0,0,.35)}
.av-float{position:absolute;display:flex;align-items:center;gap:10px;background:rgba(10,15,21,.86);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 13px;color:#fff;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:avfloat 5s ease-in-out infinite}
.av-float b{display:block;font-family:var(--disp);font-size:14px}
.av-float span{color:#a9b9c8}
.av-float .i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:#05201c;flex:none}
.av-float .i svg{width:17px;height:17px}
.av-float.f1{left:-18px;top:26px}
.av-float.f2{right:16px;top:44%;animation-delay:1.2s}
.av-float.f3{left:24px;bottom:-18px;animation-delay:2.4s}
@keyframes avfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* stats + partners */
.av-stats{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--border);border-radius:18px;background:var(--surface);margin-top:34px;overflow:hidden}
.av-stats div{padding:18px 20px;border-right:1px solid var(--border)}
.av-stats div:last-child{border-right:0}
.av-stats b{display:block;font-family:var(--disp);font-size:26px;font-weight:700}
.av-stats span{font-size:12px;color:var(--mut);line-height:1.4;display:block;margin-top:3px}
